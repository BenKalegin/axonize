name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@benkalegin'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # GITHUB_TOKEN can only read packages from this repo. The
          # @benkalegin/* deps live under a different repo, so we need a PAT
          # with read:packages scope. Configured as repo secret.
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_PAT }}

      - name: Build application
        run: pnpm build:${{ matrix.os == 'windows-latest' && 'win' || 'mac' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.portable.exe
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
